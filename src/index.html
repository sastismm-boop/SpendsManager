<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SpendLog</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#08090D',
            cardDark: '#12141C',
            surface: '#1A1D28',
            surfaceLight: '#242838',
            accentViolet: '#8B5CF6',
            accentEmerald: '#10B981',
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      background-color: #08090D;
      color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Slice App Borderless Keypad Styling */
    .slice-key {
      touch-action: manipulation;
      background: transparent;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: transform 0.05s ease, background-color 0.05s ease;
      will-change: transform;
      border-radius: 9999px;
    }
    .slice-key:active {
      transform: scale(0.88);
      background-color: rgba(255, 255, 255, 0.08);
    }
    .slice-operator:active {
      transform: scale(0.88);
      background-color: rgba(139, 92, 246, 0.25);
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto pb-28">

  <!-- ================= MAIN DASHBOARD ================= -->
  <!-- Top Header with Custom Vault Logo -->
  <div class="flex justify-between items-center pt-2 mb-4">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-violet-600 via-purple-700 to-indigo-900 p-0.5 shadow-lg shadow-purple-950/60 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-black tracking-tight text-white leading-tight">SpendLog</h1>
        <p class="text-[10px] font-semibold text-zinc-500 uppercase tracking-widest">Self Vault</p>
      </div>
    </div>
    
    <!-- Open Fullscreen Slice Keypad Button -->
    <button onclick="openAddModal()" class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-600 flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-violet-900/40 active:scale-90 transition-transform">
      +
    </button>
  </div>

  <!-- Wallet & Cash Available Balances -->
  <div class="grid grid-cols-2 gap-2.5 mb-4">
    <div onclick="openBalanceModal('UPI')" class="bg-cardDark p-3.5 rounded-2xl border border-violet-500/20 active:scale-[0.97] transition-all cursor-pointer">
      <div class="flex justify-between items-center mb-1">
        <span class="text-[10px] font-bold text-violet-400 uppercase tracking-wider">⚡ Online / UPI</span>
        <span class="text-xs text-zinc-600 font-bold">✎</span>
      </div>
      <div id="onlineBalText" class="text-lg font-black text-white">₹0</div>
      <p class="text-[9px] text-zinc-500 mt-0.5">Tap to adjust / add</p>
    </div>

    <div onclick="openBalanceModal('Cash')" class="bg-cardDark p-3.5 rounded-2xl border border-emerald-500/20 active:scale-[0.97] transition-all cursor-pointer">
      <div class="flex justify-between items-center mb-1">
        <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">💵 Cash in Hand</span>
        <span class="text-xs text-zinc-600 font-bold">✎</span>
      </div>
      <div id="cashBalText" class="text-lg font-black text-white">₹0</div>
      <p class="text-[9px] text-zinc-500 mt-0.5">Tap to adjust / add</p>
    </div>
  </div>

  <!-- Total Spend Summary Banner -->
  <div class="flex justify-between items-center px-1 mb-4">
    <span class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider">This Month Spent</span>
    <span id="monthTotal" class="text-lg font-extrabold text-white">₹0</span>
  </div>

  <!-- Spending Trend Graph Card -->
  <div class="bg-cardDark rounded-3xl p-4 mb-5 border border-white/5 shadow-2xl">
    <div class="flex justify-between items-center mb-3">
      <span class="text-xs font-bold text-zinc-400">Spending Trend</span>
      <div class="flex bg-surface p-1 rounded-xl gap-1 text-[11px] font-semibold">
        <button onclick="setTimeRange('7D')" id="btn7D" class="px-2.5 py-1 rounded-lg bg-violet-600 text-white transition-all">7D</button>
        <button onclick="setTimeRange('1M')" id="btn1M" class="px-2.5 py-1 rounded-lg text-zinc-400 hover:text-white transition-all">1M</button>
        <button onclick="setTimeRange('3M')" id="btn3M" class="px-2.5 py-1 rounded-lg text-zinc-400 hover:text-white transition-all">3M</button>
        <button onclick="setTimeRange('1Y')" id="btn1Y" class="px-2.5 py-1 rounded-lg text-zinc-400 hover:text-white transition-all">1Y</button>
        <button onclick="toggleCustomDate()" id="btnCustom" class="px-2 py-1 rounded-lg text-zinc-400 hover:text-white transition-all">📅</button>
      </div>
    </div>

    <div id="customDateRow" class="hidden mb-3 grid grid-cols-2 gap-2 text-xs">
      <input type="date" id="customStartDate" onchange="renderChart()" class="bg-surface rounded-xl px-2.5 py-1.5 text-zinc-300 focus:outline-none border border-white/5">
      <input type="date" id="customEndDate" onchange="renderChart()" class="bg-surface rounded-xl px-2.5 py-1.5 text-zinc-300 focus:outline-none border border-white/5">
    </div>

    <div class="h-36 w-full">
      <canvas id="spendChart"></canvas>
    </div>
  </div>

  <!-- Search Filter -->
  <div class="mb-4">
    <input type="text" id="searchInput" placeholder="Search spends, notes, categories..." oninput="renderTransactions()" 
           class="w-full bg-cardDark rounded-2xl px-4 py-3.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:ring-1 focus:ring-violet-500 border border-white/5">
  </div>

  <!-- Recent Transactions Section -->
  <div>
    <div class="flex justify-between items-center mb-3 px-1">
      <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-wider">History</h2>
      <button onclick="exportCSV()" class="text-xs text-violet-400 font-semibold active:opacity-70">Export CSV</button>
    </div>
    <div id="txList" class="space-y-2.5"></div>
  </div>

  <!-- ================= FULLSCREEN SLICE-STYLE SPEND SCREEN ================= -->
  <div id="addModal" class="fixed inset-0 bg-[#08090D] z-50 hidden flex flex-col justify-between p-5 pt-7 pb-6 select-none">
    
    <!-- Top Action Row -->
    <div class="flex justify-between items-center">
      <button onclick="closeAddModal()" class="w-10 h-10 rounded-full bg-surface/50 flex items-center justify-center text-zinc-400 active:scale-90 transition-transform">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <!-- Payment Mode Toggle (Slice Pill Style) -->
      <div class="flex bg-surface/60 p-1 rounded-2xl border border-white/5">
        <button type="button" id="modeUPI" onclick="setMode('UPI')" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-violet-600 text-white shadow-md shadow-violet-900/40 transition-all">
          ⚡ UPI
        </button>
        <button type="button" id="modeCash" onclick="setMode('Cash')" class="px-4 py-1.5 rounded-xl text-xs font-bold text-zinc-400 transition-all">
          💵 Cash
        </button>
      </div>
    </div>

    <!-- Center Display Area (Pure Minimalist Giant Amount) -->
    <div class="flex flex-col items-center justify-center my-auto py-2">
      <div id="calcExpr" class="text-sm font-semibold text-zinc-500 h-6 mb-1 tracking-wider font-mono"></div>
      <div class="flex items-center justify-center">
        <span class="text-4xl md:text-5xl font-black text-violet-400 mr-1.5">₹</span>
        <span id="calcDisplay" class="text-6xl md:text-7xl font-black text-white tracking-tight">0</span>
      </div>

      <!-- Quick Note / Description Input (Under Amount) -->
      <div class="w-full max-w-xs mt-3">
        <input type="text" id="txNote" placeholder="Tap to add a note..." 
               class="w-full bg-transparent text-center text-sm font-medium text-zinc-300 placeholder-zinc-600 focus:outline-none border-b border-white/5 focus:border-violet-500/50 pb-1.5 transition-colors">
      </div>

      <!-- Category Selector Pill -->
      <div class="mt-4 flex items-center gap-2 overflow-x-auto hide-scrollbar max-w-full py-1" id="frequentChipsContainer">
        <!-- Injected chips -->
      </div>
    </div>

    <!-- Bottom Half: Instant Response Zero-Delay Keypad with Feather-Light Haptics -->
    <div class="w-full max-w-sm mx-auto">
      <div class="grid grid-cols-4 gap-y-3 gap-x-2 text-center select-none">
        <!-- Row 1 -->
        <button type="button" ontouchstart="handleKeyTouch(event, '7')" onclick="handleKeyTouch(null, '7')" class="slice-key h-16 text-3xl font-medium text-white">7</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '8')" onclick="handleKeyTouch(null, '8')" class="slice-key h-16 text-3xl font-medium text-white">8</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '9')" onclick="handleKeyTouch(null, '9')" class="slice-key h-16 text-3xl font-medium text-white">9</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '/')" onclick="handleKeyTouch(null, '/')" class="slice-key slice-operator h-16 text-2xl font-bold text-violet-400">÷</button>

        <!-- Row 2 -->
        <button type="button" ontouchstart="handleKeyTouch(event, '4')" onclick="handleKeyTouch(null, '4')" class="slice-key h-16 text-3xl font-medium text-white">4</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '5')" onclick="handleKeyTouch(null, '5')" class="slice-key h-16 text-3xl font-medium text-white">5</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '6')" onclick="handleKeyTouch(null, '6')" class="slice-key h-16 text-3xl font-medium text-white">6</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '*')" onclick="handleKeyTouch(null, '*')" class="slice-key slice-operator h-16 text-2xl font-bold text-violet-400">×</button>

        <!-- Row 3 -->
        <button type="button" ontouchstart="handleKeyTouch(event, '1')" onclick="handleKeyTouch(null, '1')" class="slice-key h-16 text-3xl font-medium text-white">1</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '2')" onclick="handleKeyTouch(null, '2')" class="slice-key h-16 text-3xl font-medium text-white">2</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '3')" onclick="handleKeyTouch(null, '3')" class="slice-key h-16 text-3xl font-medium text-white">3</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '-')" onclick="handleKeyTouch(null, '-')" class="slice-key slice-operator h-16 text-2xl font-bold text-violet-400">−</button>

        <!-- Row 4 -->
        <button type="button" ontouchstart="handleKeyTouch(event, '.')" onclick="handleKeyTouch(null, '.')" class="slice-key h-16 text-3xl font-black text-zinc-400">.</button>
        <button type="button" ontouchstart="handleKeyTouch(event, '0')" onclick="handleKeyTouch(null, '0')" class="slice-key h-16 text-3xl font-medium text-white">0</button>
        <button type="button" ontouchstart="handleKeyTouch(event, 'BACK')" onclick="handleKeyTouch(null, 'BACK')" class="slice-key h-16 text-zinc-400 active:text-white flex items-center justify-center">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.5-6.5a2 2 0 011.414-.586H20a2 2 0 012 2v10a2 2 0 01-2 2h-10.086a2 2 0 01-1.414-.586L3 12z"/></svg>
        </button>
        <button type="button" ontouchstart="handleKeyTouch(event, '+')" onclick="handleKeyTouch(null, '+')" class="slice-key slice-operator h-16 text-2xl font-bold text-violet-400">+</button>
      </div>

      <!-- Big Seamless Confirm Spend Button -->
      <button type="button" onclick="saveTransaction()" class="w-full mt-4 py-4 bg-gradient-to-r from-violet-600 via-purple-600 to-indigo-600 text-white font-black rounded-3xl text-base shadow-xl shadow-violet-950/60 active:scale-[0.98] transition-transform">
        Deduct & Confirm Spend
      </button>
    </div>

  </div>

  <!-- ================= UPDATE WALLET / CASH MODAL ================= -->
  <div id="balanceModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex flex-col justify-end">
    <div class="bg-cardDark rounded-t-[36px] p-6 max-w-md mx-auto w-full border-t border-white/10">
      <div class="flex justify-between items-center mb-4">
        <h3 id="balanceModalTitle" class="text-sm font-bold text-white uppercase tracking-wider">Update Balance</h3>
        <button onclick="closeBalanceModal()" class="w-8 h-8 rounded-full bg-surface flex items-center justify-center text-zinc-400">✕</button>
      </div>
      
      <p class="text-xs text-zinc-400 mb-2">Set current total or add amount to balance:</p>
      <div class="flex items-center bg-surface rounded-2xl px-4 py-3 mb-4 border border-white/5">
        <span class="text-xl font-bold text-violet-400 mr-2">₹</span>
        <input type="number" id="balanceInput" placeholder="0" class="bg-transparent text-2xl font-extrabold text-white w-full focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="applyBalanceAction('set')" class="py-3 bg-surface rounded-xl text-xs font-bold text-zinc-200 border border-white/5 active:scale-95">
          Set Exact Amount
        </button>
        <button onclick="applyBalanceAction('add')" class="py-3 bg-violet-600 rounded-xl text-xs font-bold text-white shadow-lg shadow-violet-900/40 active:scale-95">
          + Add to Current
        </button>
      </div>
    </div>
  </div>

  <!-- ================= CATEGORY SHEET ================= -->
  <div id="categorySheet" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex flex-col justify-end">
    <div class="bg-cardDark rounded-t-[36px] p-6 max-w-md mx-auto w-full border-t border-white/10 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Select Category</h3>
        <button onclick="closeCategorySheet()" class="w-8 h-8 rounded-full bg-surface flex items-center justify-center text-zinc-400">✕</button>
      </div>
      
      <div id="categoryGrid" class="grid grid-cols-3 gap-2.5 overflow-y-auto hide-scrollbar pb-6"></div>
    </div>
  </div>

  <script>
    const CATEGORIES = [
      { name: "Food & Dining", icon: "🍔" },
      { name: "Groceries", icon: "🛒" },
      { name: "Shopping", icon: "🛍️" },
      { name: "Transport", icon: "⛽" },
      { name: "Personal", icon: "👤" },
      { name: "Bills & Recharges", icon: "📱" },
      { name: "Entertainment", icon: "🎬" },
      { name: "Fitness & Gym", icon: "🏋️" },
      { name: "Services", icon: "🧰" },
      { name: "Medical", icon: "💊" },
      { name: "Travel", icon: "✈️" },
      { name: "Transfer", icon: "🔁" },
      { name: "Miscellaneous", icon: "📦" }
    ];

    let transactions = JSON.parse(localStorage.getItem('spends_data') || '[]');
    let wallet = JSON.parse(localStorage.getItem('vault_balances') || '{"UPI": 0, "Cash": 0}');
    
    let currentMode = 'UPI';
    let selectedCategory = 'Food & Dining';
    let currentInput = '0';
    let calcExpression = '';
    let isNewNumber = true;
    let chartInstance = null;
    let currentRange = '7D';
    let targetBalMode = 'UPI';

    // Absolute Lowest Sub-Threshold Micro-Tick Haptics
    function triggerHaptic() {
      try {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) {
          window.Capacitor.Plugins.Haptics.vibrate({ duration: 1 });
        } else if (navigator.vibrate) {
          navigator.vibrate(1);
        }
      } catch (e) {}
    }

    // Zero Latency Instant Touch Handler
    function handleKeyTouch(e, val) {
      if (e) {
        e.preventDefault(); // Browser ka 300ms double-tap delay turant bypass
      }
      pressCalc(val);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
    });

    function renderAll() {
      renderBalances();
      renderTransactions();
      renderChart();
      renderCategoryChips();
    }

    function renderBalances() {
      document.getElementById('onlineBalText').innerText = `₹${(wallet.UPI || 0).toLocaleString('en-IN')}`;
      document.getElementById('cashBalText').innerText = `₹${(wallet.Cash || 0).toLocaleString('en-IN')}`;
    }

    function openBalanceModal(mode) {
      targetBalMode = mode;
      document.getElementById('balanceModalTitle').innerText = mode === 'UPI' ? 'Update UPI / Bank Balance' : 'Update Cash in Hand';
      document.getElementById('balanceInput').value = '';
      document.getElementById('balanceModal').classList.remove('hidden');
    }

    function closeBalanceModal() {
      document.getElementById('balanceModal').classList.add('hidden');
    }

    function applyBalanceAction(action) {
      const val = parseFloat(document.getElementById('balanceInput').value) || 0;
      if (val < 0) return alert('Enter a valid amount');

      if (action === 'set') {
        wallet[targetBalMode] = val;
      } else if (action === 'add') {
        wallet[targetBalMode] = (wallet[targetBalMode] || 0) + val;
      }

      localStorage.setItem('vault_balances', JSON.stringify(wallet));
      closeBalanceModal();
      renderBalances();
    }

    // ================= SLICE KEYPAD ENGINE =================
    function updateKeypadUI() {
      document.getElementById('calcDisplay').innerText = currentInput;
      document.getElementById('calcExpr').innerText = calcExpression;
    }

    function pressCalc(val) {
      triggerHaptic();

      if (val === 'BACK') {
        if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = '0';
          isNewNumber = true;
        }
        updateKeypadUI();
        return;
      }

      if (['+', '-', '*', '/'].includes(val)) {
        if (calcExpression && !isNewNumber) {
          try {
            const evaluated = eval(calcExpression + currentInput);
            currentInput = Number(evaluated.toFixed(2)).toString();
          } catch (e) {}
        }
        calcExpression = currentInput + ' ' + val + ' ';
        isNewNumber = true;
        updateKeypadUI();
        return;
      }

      if (val === '.') {
        if (!currentInput.includes('.')) {
          currentInput = isNewNumber ? '0.' : currentInput + '.';
          isNewNumber = false;
        }
        updateKeypadUI();
        return;
      }

      if (isNewNumber || currentInput === '0') {
        currentInput = val;
        isNewNumber = false;
      } else {
        if (currentInput.length < 9) {
          currentInput += val;
        }
      }
      updateKeypadUI();
    }

    function getFinalCalcValue() {
      if (calcExpression) {
        try {
          const res = eval(calcExpression + currentInput);
          return Math.max(0, Number(res.toFixed(2)));
        } catch (e) {
          return parseFloat(currentInput) || 0;
        }
      }
      return parseFloat(currentInput) || 0;
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      currentInput = '0';
      calcExpression = '';
      isNewNumber = true;
      document.getElementById('txNote').value = '';
      updateKeypadUI();
      renderCategoryChips();
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function setMode(mode) {
      triggerHaptic();
      currentMode = mode;
      const upi = document.getElementById('modeUPI');
      const cash = document.getElementById('modeCash');
      if (mode === 'UPI') {
        upi.className = "px-4 py-1.5 rounded-xl text-xs font-bold bg-violet-600 text-white shadow-md shadow-violet-900/40 transition-all";
        cash.className = "px-4 py-1.5 rounded-xl text-xs font-bold text-zinc-400 transition-all";
      } else {
        cash.className = "px-4 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-md shadow-emerald-900/40 transition-all";
        upi.className = "px-4 py-1.5 rounded-xl text-xs font-bold text-zinc-400 transition-all";
      }
    }

    function getTopCategories() {
      const counts = {};
      CATEGORIES.forEach(c => counts[c.name] = 0);
      transactions.forEach(t => { if (counts[t.category] !== undefined) counts[t.category]++; });
      return [...CATEGORIES].sort((a, b) => counts[b.name] - counts[a.name]);
    }

    function renderCategoryChips() {
      const container = document.getElementById('frequentChipsContainer');
      const sorted = getTopCategories();
      const top3 = sorted.slice(0, 3);

      if (!top3.find(c => c.name === selectedCategory)) {
        const found = CATEGORIES.find(c => c.name === selectedCategory);
        if (found) top3.unshift(found);
      }

      let html = top3.map(cat => `
        <button type="button" onclick="pickCategory('${cat.name}')" 
          class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
            selectedCategory === cat.name 
            ? 'bg-violet-600 text-white shadow-md shadow-violet-900/50' 
            : 'bg-surface/80 text-zinc-400 border border-white/5'
          }">
          ${cat.icon} ${cat.name}
        </button>
      `).join('');

      html += `
        <button type="button" onclick="openCategorySheet()" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-surface/80 text-violet-400 border border-violet-500/20 whitespace-nowrap active:scale-95">
          + All
        </button>
      `;

      container.innerHTML = html;
    }

    function pickCategory(name) {
      triggerHaptic();
      selectedCategory = name;
      renderCategoryChips();
      closeCategorySheet();
    }

    function openCategorySheet() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = CATEGORIES.map(cat => `
        <button type="button" onclick="pickCategory('${cat.name}')" class="flex flex-col items-center justify-center p-3 rounded-2xl bg-surface border ${
          selectedCategory === cat.name ? 'border-violet-500 bg-violet-950/20' : 'border-transparent'
        } active:scale-95 transition-transform">
          <span class="text-2xl mb-1">${cat.icon}</span>
          <span class="text-[11px] font-medium text-zinc-300 text-center leading-tight">${cat.name}</span>
        </button>
      `).join('');
      document.getElementById('categorySheet').classList.remove('hidden');
    }

    function closeCategorySheet() {
      document.getElementById('categorySheet').classList.add('hidden');
    }

    function saveTransaction() {
      const amount = getFinalCalcValue();
      if (amount <= 0) return alert('Enter a valid amount');

      wallet[currentMode] = (wallet[currentMode] || 0) - amount;
      localStorage.setItem('vault_balances', JSON.stringify(wallet));

      const tx = {
        id: Date.now().toString(),
        amount: amount,
        category: selectedCategory,
        mode: currentMode,
        note: document.getElementById('txNote').value.trim() || selectedCategory,
        timestamp: new Date().toISOString()
      };

      transactions.unshift(tx);
      localStorage.setItem('spends_data', JSON.stringify(transactions));
      closeAddModal();
      renderAll();
    }

    function deleteTx(id) {
      const target = transactions.find(t => t.id === id);
      if (target) {
        wallet[target.mode] = (wallet[target.mode] || 0) + target.amount;
        localStorage.setItem('vault_balances', JSON.stringify(wallet));
      }
      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('spends_data', JSON.stringify(transactions));
      renderAll();
    }

    function renderTransactions() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('txList');
      const filtered = transactions.filter(t => 
        t.category.toLowerCase().includes(q) || 
        t.note.toLowerCase().includes(q) || 
        t.amount.toString().includes(q)
      );

      const now = new Date();
      const currentMonthTotal = transactions
        .filter(t => {
          const d = new Date(t.timestamp);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        })
        .reduce((sum, t) => sum + t.amount, 0);

      document.getElementById('monthTotal').innerText = `₹${currentMonthTotal.toLocaleString('en-IN')}`;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-zinc-600 text-xs">No spends found</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => {
        const d = new Date(t.timestamp);
        const dateStr = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        const catObj = CATEGORIES.find(c => c.name === t.category) || { icon: "💰" };
        return `
          <div class="bg-cardDark rounded-2xl p-3.5 flex justify-between items-center border border-white/5">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-2xl bg-surface flex items-center justify-center text-lg">
                ${catObj.icon}
              </div>
              <div>
                <p class="text-xs font-bold text-white">${t.note}</p>
                <p class="text-[10px] text-zinc-400 font-medium">${dateStr} • <span class="${t.mode === 'UPI' ? 'text-indigo-400' : 'text-emerald-400'} font-semibold">${t.mode}</span> • ${t.category}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2.5">
              <span class="text-sm font-extrabold text-white">−₹${t.amount.toLocaleString('en-IN')}</span>
              <button onclick="deleteTx('${t.id}')" class="text-zinc-500 hover:text-red-400 text-xs px-1">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setTimeRange(range) {
      currentRange = range;
      ['7D', '1M', '3M', '1Y'].forEach(r => {
        const el = document.getElementById('btn' + r);
        if (r === range) {
          el.className = "px-2.5 py-1 rounded-lg bg-violet-600 text-white transition-all";
        } else {
          el.className = "px-2.5 py-1 rounded-lg text-zinc-400 hover:text-white transition-all";
        }
      });
      document.getElementById('customDateRow').classList.add('hidden');
      renderChart();
    }

    function toggleCustomDate() {
      const row = document.getElementById('customDateRow');
      row.classList.toggle('hidden');
      if (!row.classList.contains('hidden')) {
        currentRange = 'CUSTOM';
        ['7D', '1M', '3M', '1Y'].forEach(r => {
          document.getElementById('btn' + r).className = "px-2.5 py-1 rounded-lg text-zinc-400 transition-all";
        });
      }
    }

    function renderChart() {
      const ctx = document.getElementById('spendChart').getContext('2d');
      let labels = [];
      let totals = [];
      let numPoints = 7;
      let groupByMonth = false;

      if (currentRange === '7D') numPoints = 7;
      else if (currentRange === '1M') numPoints = 30;
      else if (currentRange === '3M') numPoints = 90;
      else if (currentRange === '1Y') groupByMonth = true;

      if (groupByMonth) {
        for (let i = 11; i >= 0; i--) {
          const d = new Date();
          d.setMonth(d.getMonth() - i);
          const m = d.getMonth();
          const y = d.getFullYear();
          labels.push(d.toLocaleDateString('en-IN', { month: 'short' }));
          const sum = transactions
            .filter(t => {
              const td = new Date(t.timestamp);
              return td.getMonth() === m && td.getFullYear() === y;
            })
            .reduce((acc, t) => acc + t.amount, 0);
          totals.push(sum);
        }
      } else if (currentRange === 'CUSTOM') {
        const startVal = document.getElementById('customStartDate').value;
        const endVal = document.getElementById('customEndDate').value;
        if (startVal && endVal) {
          let cur = new Date(startVal);
          const end = new Date(endVal);
          while (cur <= end) {
            const dateStr = cur.toISOString().split('T')[0];
            labels.push(cur.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
            const sum = transactions.filter(t => t.timestamp.startsWith(dateStr)).reduce((a, b) => a + b.amount, 0);
            totals.push(sum);
            cur.setDate(cur.getDate() + 1);
          }
        }
      } else {
        const step = currentRange === '3M' ? 3 : 1;
        for (let i = numPoints - 1; i >= 0; i -= step) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          labels.push(d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
          const sum = transactions
            .filter(t => t.timestamp.startsWith(dateStr))
            .reduce((acc, t) => acc + t.amount, 0);
          totals.push(sum);
        }
      }

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: totals,
            borderColor: '#8B5CF6',
            borderWidth: 2.5,
            tension: 0.4,
            fill: true,
            backgroundColor: 'rgba(139, 92, 246, 0.1)',
            pointBackgroundColor: '#8B5CF6',
            pointRadius: labels.length > 15 ? 0 : 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717A', font: { size: 9 }, maxTicksLimit: 7 } },
            y: { display: false }
          }
        }
      });
    }

    function exportCSV() {
      if (transactions.length === 0) return alert('No data to export');
      let csv = 'ID,Amount,Category,Mode,Note,Timestamp\n';
      transactions.forEach(t => {
        csv += `"${t.id}",${t.amount},"${t.category}","${t.mode}","${t.note}","${t.timestamp}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Spends_Export_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }
  </script>
</body>
</html>
