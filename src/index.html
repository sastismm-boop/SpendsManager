<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SpendLog</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#0D0E12',
            cardDark: '#16181F',
            cardBorder: '#232634',
            accentPurple: '#7C3AED',
            accentPink: '#EC4899',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0D0E12;
      color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24">

  <!-- Header & Total Spends -->
  <div class="flex justify-between items-center pt-4 mb-4">
    <div>
      <p class="text-xs text-zinc-400 font-medium tracking-wide uppercase">This Month</p>
      <h1 id="monthTotal" class="text-3xl font-extrabold tracking-tight text-white mt-0.5">₹0</h1>
    </div>
    <button onclick="openAddModal()" class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-purple-900/40 active:scale-95 transition-transform">
      +
    </button>
  </div>

  <!-- Smooth Monthly Spending Chart -->
  <div class="bg-cardDark border border-cardBorder rounded-3xl p-4 mb-6 shadow-xl">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs font-semibold text-zinc-400">Spending Trend</span>
      <span class="text-xs font-medium text-purple-400 bg-purple-950/60 px-2 py-0.5 rounded-full border border-purple-800/40">Last 7 Days</span>
    </div>
    <div class="h-32 w-full">
      <canvas id="spendChart"></canvas>
    </div>
  </div>

  <!-- Search Filter -->
  <div class="mb-4 relative">
    <input type="text" id="searchInput" placeholder="Search spends, category, note..." oninput="renderTransactions()" 
           class="w-full bg-cardDark border border-cardBorder rounded-2xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500 transition-colors">
  </div>

  <!-- Recent Spends List -->
  <div>
    <div class="flex justify-between items-center mb-3 px-1">
      <h2 class="text-sm font-semibold text-zinc-400">Recent Spends</h2>
      <button onclick="exportCSV()" class="text-xs text-purple-400 hover:underline">Export CSV</button>
    </div>
    <div id="txList" class="space-y-2.5">
      <!-- Injected by JavaScript -->
    </div>
  </div>

  <!-- Bottom Sheet Add Modal with Calculator -->
  <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
    <div class="bg-cardDark border-t border-cardBorder rounded-t-[32px] p-5 max-w-md mx-auto w-full animate-slide-up">
      
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-semibold text-zinc-400">New Spend</span>
        <button onclick="closeAddModal()" class="text-zinc-400 text-lg px-2">✕</button>
      </div>

      <!-- Calculator Display -->
      <div class="bg-bgDark border border-cardBorder rounded-2xl p-3 mb-3 text-right">
        <div id="calcExpr" class="text-xs text-zinc-500 h-4"></div>
        <div class="flex items-center justify-between">
          <span class="text-xl font-bold text-purple-400">₹</span>
          <input type="text" id="calcDisplay" readonly value="0" class="bg-transparent text-right text-3xl font-extrabold text-white w-full focus:outline-none">
        </div>
      </div>

      <!-- Mode Selector (UPI vs Cash) -->
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button type="button" id="modeUPI" onclick="setMode('UPI')" class="py-2 rounded-xl text-xs font-semibold border border-purple-500 bg-purple-900/30 text-purple-300">
          ⚡ UPI / Online
        </button>
        <button type="button" id="modeCash" onclick="setMode('Cash')" class="py-2 rounded-xl text-xs font-semibold border border-cardBorder bg-bgDark text-zinc-400">
          💵 Cash
        </button>
      </div>

      <!-- Optional Note -->
      <input type="text" id="txNote" placeholder="Add note (optional)" class="w-full bg-bgDark border border-cardBorder rounded-xl px-3 py-2 text-xs text-white mb-3 focus:outline-none focus:border-purple-500">

      <!-- Dynamic Frequent Category Chips -->
      <div class="mb-3">
        <div class="text-[11px] font-semibold text-zinc-400 mb-1.5 flex justify-between">
          <span>Category (Top Used)</span>
          <select id="moreCategorySelect" onchange="selectDropdownCategory(this.value)" class="bg-bgDark text-zinc-300 border border-cardBorder rounded-lg px-1.5 py-0.5 text-[11px] focus:outline-none">
            <option value="">More categories...</option>
          </select>
        </div>
        <div id="frequentChips" class="flex gap-1.5 overflow-x-auto hide-scrollbar py-1">
          <!-- Dynamic Chips injected here -->
        </div>
      </div>

      <!-- Custom Keypad & Calculator Pad -->
      <div class="grid grid-cols-4 gap-1.5 mb-3 text-sm font-semibold">
        <button onclick="pressCalc('7')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">7</button>
        <button onclick="pressCalc('8')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">8</button>
        <button onclick="pressCalc('9')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">9</button>
        <button onclick="pressCalc('/')" class="bg-purple-950/40 text-purple-300 py-3 rounded-xl border border-purple-800/40 active:bg-purple-900">÷</button>

        <button onclick="pressCalc('4')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">4</button>
        <button onclick="pressCalc('5')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">5</button>
        <button onclick="pressCalc('6')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">6</button>
        <button onclick="pressCalc('*')" class="bg-purple-950/40 text-purple-300 py-3 rounded-xl border border-purple-800/40 active:bg-purple-900">×</button>

        <button onclick="pressCalc('1')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">1</button>
        <button onclick="pressCalc('2')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">2</button>
        <button onclick="pressCalc('3')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">3</button>
        <button onclick="pressCalc('-')" class="bg-purple-950/40 text-purple-300 py-3 rounded-xl border border-purple-800/40 active:bg-purple-900">−</button>

        <button onclick="pressCalc('C')" class="bg-red-950/30 text-red-400 py-3 rounded-xl border border-red-900/40 active:bg-red-900/50">C</button>
        <button onclick="pressCalc('0')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">0</button>
        <button onclick="pressCalc('.')" class="bg-bgDark py-3 rounded-xl border border-cardBorder active:bg-zinc-800">.</button>
        <button onclick="pressCalc('+')" class="bg-purple-950/40 text-purple-300 py-3 rounded-xl border border-purple-800/40 active:bg-purple-900">+</button>
      </div>

      <!-- Save Button -->
      <button onclick="saveTransaction()" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold rounded-2xl shadow-lg shadow-purple-900/50 active:scale-[0.98] transition-transform">
        Save Spend
      </button>

    </div>
  </div>

  <script>
    const ALL_CATEGORIES = [
      "Food & Dining", "Groceries", "Shopping", "Transport", "Personal", 
      "Recharges & Bills", "Entertainment", "Fitness", "Services", "Medical", 
      "Travel", "Transfer", "Miscellaneous"
    ];

    let transactions = JSON.parse(localStorage.getItem('spends_data') || '[]');
    let currentMode = 'UPI';
    let selectedCategory = 'Food & Dining';
    let calcExpression = '';
    let chartInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
      setupDropdown();
    });

    function renderAll() {
      renderTransactions();
      renderChart();
      updateFrequentChips();
    }

    // Calculator Functions
    function pressCalc(val) {
      const display = document.getElementById('calcDisplay');
      const expr = document.getElementById('calcExpr');

      if (val === 'C') {
        calcExpression = '';
        display.value = '0';
        expr.innerText = '';
        return;
      }

      if (['+', '-', '*', '/'].includes(val)) {
        try {
          if (calcExpression !== '') {
            calcExpression = eval(calcExpression).toString();
          }
        } catch(e){}
        calcExpression += val;
        expr.innerText = calcExpression;
        display.value = '0';
        return;
      }

      if (display.value === '0' && val !== '.') {
        calcExpression = calcExpression.endsWith('+') || calcExpression.endsWith('-') || calcExpression.endsWith('*') || calcExpression.endsWith('/') 
          ? calcExpression + val : val;
        display.value = val;
      } else {
        calcExpression += val;
        display.value = display.value + val;
      }
    }

    function evaluateCalc() {
      try {
        if (!calcExpression) return parseFloat(document.getElementById('calcDisplay').value) || 0;
        const res = eval(calcExpression);
        return isNaN(res) ? 0 : parseFloat(res.toFixed(2));
      } catch (e) {
        return parseFloat(document.getElementById('calcDisplay').value) || 0;
      }
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      pressCalc('C');
      updateFrequentChips();
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function setMode(mode) {
      currentMode = mode;
      const upiBtn = document.getElementById('modeUPI');
      const cashBtn = document.getElementById('modeCash');
      if (mode === 'UPI') {
        upiBtn.className = "py-2 rounded-xl text-xs font-semibold border border-purple-500 bg-purple-900/30 text-purple-300";
        cashBtn.className = "py-2 rounded-xl text-xs font-semibold border border-cardBorder bg-bgDark text-zinc-400";
      } else {
        cashBtn.className = "py-2 rounded-xl text-xs font-semibold border border-purple-500 bg-purple-900/30 text-purple-300";
        upiBtn.className = "py-2 rounded-xl text-xs font-semibold border border-cardBorder bg-bgDark text-zinc-400";
      }
    }

    // Dynamic Top Frequent Categories
    function getTopCategories() {
      const counts = {};
      ALL_CATEGORIES.forEach(c => counts[c] = 0);
      transactions.forEach(t => { if (counts[t.category] !== undefined) counts[t.category]++; });
      return [...ALL_CATEGORIES].sort((a, b) => counts[b] - counts[a]).slice(0, 5);
    }

    function updateFrequentChips() {
      const container = document.getElementById('frequentChips');
      const top5 = getTopCategories();
      if (!top5.includes(selectedCategory)) {
        top5.unshift(selectedCategory);
      }
      container.innerHTML = top5.map(cat => `
        <button type="button" onclick="selectChip('${cat}')" 
          class="px-3 py-1.5 rounded-xl text-xs whitespace-nowrap border transition-all ${
            selectedCategory === cat 
            ? 'bg-purple-600 text-white border-purple-500 shadow-md shadow-purple-900/40 font-semibold' 
            : 'bg-bgDark text-zinc-400 border-cardBorder'
          }">
          ${cat}
        </button>
      `).join('');
    }

    function selectChip(cat) {
      selectedCategory = cat;
      updateFrequentChips();
    }

    function setupDropdown() {
      const select = document.getElementById('moreCategorySelect');
      ALL_CATEGORIES.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        select.appendChild(opt);
      });
    }

    function selectDropdownCategory(val) {
      if (!val) return;
      selectedCategory = val;
      updateFrequentChips();
    }

    function saveTransaction() {
      const amount = evaluateCalc();
      if (amount <= 0) return alert('Please enter a valid amount');

      const tx = {
        id: Date.now().toString(),
        amount: amount,
        category: selectedCategory,
        mode: currentMode,
        note: document.getElementById('txNote').value.trim() || selectedCategory,
        timestamp: new Date().toISOString()
      };

      transactions.unshift(tx);
      localStorage.setItem('spends_data', JSON.stringify(transactions));
      closeAddModal();
      document.getElementById('txNote').value = '';
      renderAll();
    }

    function deleteTx(id) {
      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('spends_data', JSON.stringify(transactions));
      renderAll();
    }

    function renderTransactions() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('txList');
      const filtered = transactions.filter(t => 
        t.category.toLowerCase().includes(q) || 
        t.note.toLowerCase().includes(q) || 
        t.amount.toString().includes(q)
      );

      const now = new Date();
      const currentMonthTotal = transactions
        .filter(t => {
          const d = new Date(t.timestamp);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        })
        .reduce((sum, t) => sum + t.amount, 0);

      document.getElementById('monthTotal').innerText = `₹${currentMonthTotal.toLocaleString('en-IN')}`;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs">No transactions found</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => {
        const d = new Date(t.timestamp);
        const dateStr = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        return `
          <div class="bg-cardDark border border-cardBorder rounded-2xl p-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-xl bg-purple-950/40 border border-purple-800/40 flex items-center justify-center text-xs text-purple-300 font-bold">
                ${t.category.charAt(0)}
              </div>
              <div>
                <p class="text-xs font-semibold text-white">${t.note}</p>
                <p class="text-[10px] text-zinc-400">${dateStr} • <span class="${t.mode === 'UPI' ? 'text-indigo-400' : 'text-emerald-400'}">${t.mode}</span> • ${t.category}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2">
              <span class="text-sm font-bold text-white">₹${t.amount.toLocaleString('en-IN')}</span>
              <button onclick="deleteTx('${t.id}')" class="text-zinc-500 hover:text-red-400 text-xs px-1">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderChart() {
      const ctx = document.getElementById('spendChart').getContext('2d');
      const days = [];
      const totals = [];

      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dayStr = d.toISOString().split('T')[0];
        days.push(d.toLocaleDateString('en-IN', { weekday: 'short' }));
        
        const sum = transactions
          .filter(t => t.timestamp.startsWith(dayStr))
          .reduce((acc, t) => acc + t.amount, 0);
        totals.push(sum);
      }

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: days,
          datasets: [{
            data: totals,
            borderColor: '#A855F7',
            borderWidth: 2.5,
            tension: 0.4,
            fill: true,
            backgroundColor: 'rgba(168, 85, 247, 0.08)',
            pointBackgroundColor: '#A855F7',
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#71717A', font: { size: 10 } } },
            y: { display: false }
          }
        }
      });
    }

    function exportCSV() {
      if (transactions.length === 0) return alert('No data to export');
      let csv = 'ID,Amount,Category,Mode,Note,Timestamp\n';
      transactions.forEach(t => {
        csv += `"${t.id}",${t.amount},"${t.category}","${t.mode}","${t.note}","${t.timestamp}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Spends_Backup_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }
  </script>
</body>
</html>
