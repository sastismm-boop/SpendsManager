name: Build and Release Direct APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Install
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SpendLog.apk

      - name: Upload to GitHub Release (Direct Download & Install)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-build
          name: "SpendLog Latest Release"
          body: "Direct installable APK without zip extraction. Download SpendLog.apk directly to phone."
          files: SpendLog.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendLog-Direct
          path: SpendLog.apk
