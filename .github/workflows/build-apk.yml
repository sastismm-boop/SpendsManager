name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Custom App Launcher Icon
        run: |
          sudo apt-get install -y imagemagick librsvg2-bin
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <rect width="512" height="512" rx="128" fill="#090A0F"/>
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8B5CF6"/>
                <stop offset="50%" stop-color="#6D28D9"/>
                <stop offset="100%" stop-color="#312E81"/>
              </linearGradient>
            </defs>
            <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#grad)"/>
            <path d="M256 110 L130 180 L256 250 L382 180 Z" fill="#FFFFFF" fill-opacity="0.95"/>
            <path d="M130 250 L256 320 L382 250" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M130 320 L256 390 L382 320" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          EOF
          rsvg-convert -w 512 -h 512 icon.svg -o icon.png
          
          # Replace icons across Android mipmap density folders
          for dir in android/app/src/main/res/mipmap*; do
            if [ -d "$dir" ]; then
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SpendLog.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-build
          name: "SpendLog Direct APK"
          body: "Direct APK installation ready."
          files: SpendLog.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact Fallback
        uses: actions/upload-artifact@v4
        with:
          name: SpendLog-APK
          path: SpendLog.apk
