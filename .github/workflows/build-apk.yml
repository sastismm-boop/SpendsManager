name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Custom Launcher Icon
        run: |
          python3 -c "
          from PIL import Image, ImageDraw

          size = (512, 512)
          img = Image.new('RGBA', size, (9, 10, 15, 255))
          draw = ImageDraw.Draw(img)

          # Draw layered neon/violet vault logo
          draw.rounded_rectangle([32, 32, 480, 480], radius=110, fill=(124, 58, 237, 255))
          draw.polygon([(256, 110), (130, 185), (256, 260), (382, 185)], fill=(255, 255, 255, 255))
          draw.line([(130, 255), (256, 325), (382, 255)], fill=(255, 255, 255, 255), width=24)
          draw.line([(130, 325), (256, 395), (382, 325)], fill=(255, 255, 255, 255), width=24)

          img.save('icon.png')
          "

          # Inject into all mipmap density folders
          for dir in android/app/src/main/res/mipmap*; do
            if [ -d "$dir" ]; then
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SpendLog.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-build
          name: "SpendLog Direct APK"
          body: "Direct APK installation ready."
          files: SpendLog.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact Fallback
        uses: actions/upload-artifact@v4
        with:
          name: SpendLog-APK
          path: SpendLog.apk
