name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Android Vibrate Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml

      - name: Apply Custom Vault Icon
        run: |
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#8B5CF6"
                  android:pathData="M18,18h72v72h-72z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,32L28,46L54,60L80,46Z"/>
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M28,60L54,74L80,60"/>
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M28,74L54,88L80,74"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#08090D</color>
          </resources>
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SpendLog.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          git push origin :refs/tags/v1.0.0 || true
          gh release create v1.0.0 SpendLog.apk --title "SpendLog v1.0.0" --notes "Direct installable APK with native haptics"

      - name: Fallback Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendLog-APK
          path: SpendLog.apk
